version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: revoflux_fleet_db
    environment:
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: fleet_secret_pass
      POSTGRES_DB: revoflux_fleet
    ports:
      - "5433:5432"
    volumes:
      - fleet_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: revoflux_fleet_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://fleet_admin:fleet_secret_pass@db:5432/revoflux_fleet"
    depends_on:
      - db

volumes:
  fleet_data:
